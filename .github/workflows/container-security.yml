name: Container Security

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image-scan:
    name: Container vulnerability gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: Build local image for scanning
        run: docker build --pull --tag nats-k8s-health-bridge:security .
      - name: Report high and critical vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: nats-k8s-health-bridge:security
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '0'
      - name: Block fixable critical vulnerabilities
        uses: aquasecurity/trivy-action@0.33.1
        with:
          image-ref: nats-k8s-health-bridge:security
          format: table
          vuln-type: os,library
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: '1'
