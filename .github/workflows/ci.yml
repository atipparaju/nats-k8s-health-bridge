name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      publish_image:
        description: "Explicitly publish container image from a v* tag ref"
        type: boolean
        required: true
        default: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  test:
    name: Test & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Static, offline guard against accidental image publishing paths.
      - name: Verify release safeguards
        run: python3 scripts/check_release_safety.py

      - name: Validate unreleased release metadata
        run: python3 scripts/check_release_metadata.py

      - name: Test private history log audit (offline, no credentials)
        run: python3 -m unittest discover -s scripts -p 'test_audit_actions_log_disclosure.py' -v

      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1
        with:
          version: v3.22.1

      - name: Validate Helm templates and Secret options
        run: |
          helm lint helm/nats-k8s-health-bridge
          python3 scripts/test_helm_templates.py

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.11'
          cache: true

      - name: Verify Go formatting
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go'))"
          if [ -n "$unformatted" ]; then
            echo "Go files requiring gofmt:"
            echo "$unformatted"
            echo "Canonical formatting patch:"
            gofmt -d $(git ls-files '*.go')
            echo "Run gofmt -w on the files listed above and commit the changes."
            exit 1
          fi

      - name: Tidy
        run: go mod tidy && git diff --exit-code

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v2.15.0

      - name: Test with coverage
        run: go test -race -count=1 -timeout=60s -coverprofile=coverage.out -covermode=atomic ./...

      - name: Upload coverage
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  integration-test:
    name: Integration Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.11'
          cache: true

      - name: Start NATS with JetStream
        run: |
          docker run -d --name nats-test -p 4222:4222 nats:2.15.3-alpine3.22@sha256:558394a23dd3c36f2d3a64b51865fd09908010e80a542cea5e75c2af543ed62a -js
          sleep 2
          docker logs nats-test

      - name: Run integration tests
        env:
          NATS_URL: nats://localhost:4222
        run: go test -race -count=1 -timeout=120s -tags=integration ./...

      - name: Stop NATS
        if: always()
        run: docker stop nats-test && docker rm nats-test

  build-push:
    name: Publish approved release image
    runs-on: ubuntu-latest
    needs: [test, integration-test]
    # Never publish on push (including main or tag pushes), or on pull requests.
    # An operator must manually dispatch this workflow against a v* tag ref
    # and explicitly enable publish_image. GHCR package visibility is separately managed.
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_image == true && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0  # needed for git describe

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Release-specific tags only; avoid floating branch/latest/major.minor tags.
          tags: |
            type=semver,pattern={{version}}
            type=sha,prefix=sha-

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          platforms: linux/amd64,linux/arm64
