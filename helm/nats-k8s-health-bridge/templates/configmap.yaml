apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "nats-k8s-health-bridge.fullname" . }}
  labels:
    {{- include "nats-k8s-health-bridge.labels" . | nindent 4 }}
data:
  config.yaml: |
    log_level: info
    poll_interval: {{ .Values.pollInterval | quote }}
    poll_timeout: {{ .Values.pollTimeout | quote }}
    max_observation_age: {{ .Values.maxObservationAge | quote }}
    server:
      port: {{ .Values.port }}
      bind_address: {{ .Values.server.bindAddress | quote }}
      readiness_fail_on_degraded: {{ .Values.server.readinessFailOnDegraded }}
      allow_unauthenticated_diagnostics: {{ .Values.server.allowUnauthenticatedDiagnostics }}
      shutdown_timeout: 10s
    nats:
      url: {{ .Values.nats.url | quote }}
      connect_timeout: 5s
      reconnect_wait: 2s
      max_reconnects: -1
    consumers:
    {{- range .Values.consumers }}
    {{- $thresholds := .thresholds | default dict }}
      - name: {{ .name }}
        stream: {{ .stream | quote }}
        consumer: {{ .consumer | quote }}
        heartbeat_timeout: {{ .heartbeatTimeout | default "0s" | quote }}
        thresholds:
          max_lag: {{ get $thresholds "maxLag" | default 0 }}
          max_ack_pending: {{ get $thresholds "maxAckPending" | default 0 }}
    {{- end }}
    # This is documentation data only, not a Deployment or Pod.
  sidecar-example.yaml: |
{{ include "nkhb.sidecarExample" . | indent 4 }}
