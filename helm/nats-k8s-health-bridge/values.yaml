# This chart renders configuration plus a non-deploying sidecar example, NOT a Deployment.
# Build/load an approved image locally before using this example.
# Never assume a GHCR package exists or is publicly pullable.
image:
  repository: nats-k8s-health-bridge
  tag: local
  pullPolicy: Never # For a locally preloaded image. Use IfNotPresent for a verified published digest.

port: 8080
pollInterval: 10s
pollTimeout: 8s
maxObservationAge: 30s

server:
  bindAddress: 0.0.0.0
  readinessFailOnDegraded: false
  allowUnauthenticatedDiagnostics: false
  # Optional existing Secrets with a "token" key. Empty = no env var.
  metricsTokenSecret: ""
  statusTokenSecret: ""

nats:
  url: nats://nats:4222
  # Existing Secret with "user.creds"; alternatively use nkeySecret with "user.nkey".
  credentialsSecret: ""
  nkeySecret: ""
  # Existing TLS Secret with "ca.crt"; optionally "tls.crt"/"tls.key".
  tlsSecret: ""
  tlsClientAuth: false # true requires tlsSecret with tls.crt and tls.key

consumers: []
# - name: order-processor
#   stream: ORDERS
#   consumer: order-processor
#   heartbeatTimeout: 30s
#   thresholds:
#     maxLag: 1000
#     maxAckPending: 500

resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

probes:
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
