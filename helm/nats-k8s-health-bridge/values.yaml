image:
  repository: ghcr.io/atipparaju/nats-k8s-health-bridge
  tag: latest
  pullPolicy: IfNotPresent

# Port the sidecar listens on
port: 8080
pollInterval: 10s
pollTimeout: 8s
maxObservationAge: 30s
server:
  bindAddress: 0.0.0.0
  readinessFailOnDegraded: false
  allowUnauthenticatedDiagnostics: false # Only enable in isolated development environments
  # Reference existing Kubernetes Secrets; never place tokens in values.yaml.
  metricsTokenSecret: ""
  statusTokenSecret: ""
# HTTP endpoint security: configure matching values in the mounted bridge config.
# Kubernetes HTTP probes normally require a pod-reachable bind address.
# Use Kubernetes Secrets for diagnostic bearer tokens, not values.yaml.
# Apply NetworkPolicies and avoid exposing the sidecar through public Services.


# NATS connection
nats:
  url: nats://nats:4222
  credentialsSecret: ""   # K8s secret name containing user.creds
  tlsSecret: ""           # K8s secret name containing tls.crt, tls.key, ca.crt

# Consumers to monitor (mirrors config.yaml consumers[])
consumers: []
# - name: order-processor
#   stream: ORDERS
#   consumer: order-processor
#   heartbeatTimeout: 30s
#   thresholds:
#     maxLag: 1000
#     maxAckPending: 500

# Resources for the sidecar container
resources:
  requests:
    cpu: 10m
    memory: 32Mi
  limits:
    cpu: 100m
    memory: 64Mi

# Liveness and readiness probe config
probes:
  liveness:
    initialDelaySeconds: 5
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
